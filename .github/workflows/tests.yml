name: tests

on:
  push:
    branches: [main, refactor/large-cap-strategies, ui/v12-dashboard]
  pull_request:
    branches: [main, refactor/large-cap-strategies]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
